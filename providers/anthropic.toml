# Anthropic models, reached through Claude Code.
#
# Claude Code is the only application which can use a Claude subscription:
# Anthropic forbids subscription tokens in third-party tools. An API key works
# either way.
#
# The names below are settings the adapter is asked for, not Claude Code's own
# configuration keys -- this file is deserialized and its values handed over as
# data. There is no model listing to check a name against before the first
# delivery, so a mistyped one shows up there.
#
# Install this file in your radicle-team providers directory. The app only
# reads it; copy a newer version there when you want to update it.

adapter = "claude-code"

[auth]
ways = ["key", "subscription"]

[auth.key]
env = ["ANTHROPIC_API_KEY"]

# Which model the member runs; higher picks the sharper (and slower) one.
#
# Cheapest to dearest, per million tokens: Sonnet 5 is 2 in and 10 out, Opus 5
# is 5 and 25, Fable 5 is 10 and 50.
#
# Only models supporting an effort level are on this ladder. Claude Haiku 4.5
# is cheaper still but does not, and a ladder mixing the two would send a
# setting one half rejects.
[INT]
param = "model"
values = [
  "claude-sonnet-5",
  "claude-sonnet-5",
  "claude-sonnet-5",
  "claude-opus-5.5",
  "claude-fable-5.1",
]

# How much work the model puts into a response, thinking and tool calls alike.
# Not a thinking budget: the models above reject that older control outright.
#
# Ascending, because a high score means deliberating rather than answering from
# the top of its head.
[ACC]
param = "effort"
values = ["low", "medium", "high", "xhigh", "max"]
