# Models served locally by Ollama, reached through OpenCode.
#
# The names below are settings the adapter is asked for, not OpenCode's own
# configuration keys -- this file is deserialized and its values handed over as
# data.
#
# Ollama is not in the models.dev registry, because what you can run is
# whatever you have pulled. The names below are real Ollama tags. To use your
# own, edit your installed copy in place. `ollama list` shows what you have.
# Several rungs may name the same model; a machine with one model runs every
# member on it. Install or update this file by copying it into your
# radicle-team providers directory.

adapter = "opencode"

[auth]
ways = ["none"]

# Which model the member runs; higher picks the sharper (and slower) one.
[INT]
param = "model"
values = [
  "ollama/qwen3.5:9b",
  "ollama/qwen3.5:9b",
  "ollama/qwen3.5:27b",
  "ollama/qwen3.5:35b",
  "ollama/qwen3.5:35b",
]

# Local models mostly have no reasoning control, so temperature is the lever
# that works here. Descending, because a high score means sticking to the
# obvious answer.
[ACC]
param = "temperature"
values = [0.9, 0.7, 0.5, 0.3, 0.1]

