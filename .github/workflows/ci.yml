name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: platform-${{ runner.os }}

      - name: Check
        run: cargo check --workspace --all-features --all-targets

      - name: Run tests
        run: cargo test --workspace --all-features --all-targets

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Rust nightly tools
        run: rustup toolchain install nightly --component miri --component rust-src --component rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Cache cargo quality tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-nextest*
            ~/.cargo/bin/cargo-llvm-cov*
            ~/.cargo/bin/cargo-crap*
            ~/.cargo/bin/similarity-rs*
            ~/.cargo/bin/cargo-machete*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cache/cargo-binstall
          key: cargo-quality-tools-${{ runner.os }}-v1-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install quality tools
        run: cargo binstall cargo-nextest cargo-llvm-cov cargo-crap similarity-rs cargo-machete --no-confirm

      - name: Lint
        run: make lint

      - name: Code health
        run: make code-health
