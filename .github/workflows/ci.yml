name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Zerobox launches sandboxed processes through bubblewrap on Linux. Ubuntu 23.10 and later
      # also confine unprivileged user namespaces by default, which bubblewrap needs to build its
      # uid map, so that restriction is lifted here and verified before the tests run.
      - name: Install bubblewrap
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install --yes bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --dev-bind / / --unshare-user true

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: platform-${{ runner.os }}

      - name: Check
        run: cargo check --workspace --all-features --all-targets

      - name: Run tests
        run: cargo test --workspace --all-features --all-targets

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `make test-all` runs the sandbox spawn tests, which need bubblewrap and unconfined
      # unprivileged user namespaces on Linux.
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install --yes bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --dev-bind / / --unshare-user true

      - name: Install Rust nightly tools
        run: rustup toolchain install nightly --component rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install quality tools
        run: |
          cargo binstall --no-confirm --force cargo-nextest cargo-llvm-cov cargo-crap similarity-rs cargo-machete
          cargo binstall --no-confirm --force rumdl@0.2.75
          command -v cargo-nextest cargo-llvm-cov cargo-crap similarity-rs cargo-machete rumdl

      - name: Lint
        run: make lint

      - name: Code health
        run: make code-health
