[package]
name = "radicle-team"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[[bin]]
name = "rad-team"
path = "src/main.rs"

[workspace]
resolver = "3"
members = ["sandbox-helper"]

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.8"
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive", "env"] }
cliclack = "0.5.5"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
console = "0.16.4"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
futures-util = "0.3.32"
git2 = { version = "0.20.4", default-features = false }
globset = "0.4.16"
hyper = { version = "1.11.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
irc-proto = "1.1.0"
keyring = "4.1.5"
radicle = "0.24.0"
rand = "0.9.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rcgen = "0.14.8"
rmcp = { version = "2.2.0", features = ["transport-streamable-http-server"] }
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlite = "0.37.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-util = "0.7.19"
toml_edit = { version = "0.25.13", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
url = "2.5.8"
zerobox = "=0.3.3"
zerobox-network-proxy = "=0.3.3"
zerobox-protocol = "=0.3.3"
zerobox-sandboxing = "=0.3.3"
zerobox-utils-absolute-path = "=0.3.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
rmcp = { version = "2.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }

# Linux sandboxing re-enters this binary as `zerobox-linux-sandbox`, which requires helper
# dispatch before argument parsing. libtest owns `main` in a harness test and never dispatches,
# so sandboxed spawning can only be verified from a binary that controls its own `main`.
[[test]]
name = "sandbox_spawn"
harness = false

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Don't panic.
string_slice = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Don't fail silently.
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't do bad async stuff.
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"

# Don't do unsafe things with memory.
mem_forget = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't do potentially incorrect things with numbers.
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

# Don't do bad things that are easy to avoid.
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"

# Require intentional lint suppressions.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
